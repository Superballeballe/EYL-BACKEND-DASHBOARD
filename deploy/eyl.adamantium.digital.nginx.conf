# /etc/nginx/sites-available/eyl.adamantium.digital
# Symlink into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# Before TLS: run `sudo certbot --nginx -d eyl.adamantium.digital` AFTER this is
# live on port 80 — certbot will rewrite this file to add the 443 block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name eyl.adamantium.digital;

    # Upload limit (bumped for any future Excel re-imports through the UI).
    client_max_body_size 25M;

    # Long-lived static asset caching — Next.js fingerprints filenames itself.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
